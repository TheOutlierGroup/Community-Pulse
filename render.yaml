# Render Blueprint — adjust names and regions as needed.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pulse-crm-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_SURFACE
        value: crm
      - key: VITE_APP_SURFACE
        value: crm
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: STORAGE_PATH
        value: /var/pulse-storage
      - key: FRONTEND_ORIGIN
        sync: false
      # CRM web URL, e.g. https://crm.example.com
      - key: CRM_APP_URL
        sync: false
      # Pulse web URL, e.g. https://pulse.example.com
      - key: PULSE_APP_URL
        sync: false
      - key: VITE_CRM_APP_URL
        sync: false
      - key: VITE_PULSE_APP_URL
        sync: false
      # Public site URL fallback for password reset/email links
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ENFORCE_HTTPS
        value: "true"
      # Same secret the retention cron sends as Authorization: Bearer …
      - key: PRIVACY_MAINTENANCE_SECRET
        sync: false
    disk:
      name: pulse-crm-disk
      mountPath: /var/pulse-storage
      sizeGB: 1

  - type: web
    name: pulse-app-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    # Omit `disk:` if this service has no persistent volume; session exports should be created via CRM.
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_SURFACE
        value: pulse
      - key: VITE_APP_SURFACE
        value: pulse
      - key: JWT_SECRET
        sync: false
      - key: INVITE_TOKEN_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: STORAGE_PATH
        value: /var/pulse-storage
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CRM_APP_URL
        sync: false
      - key: PULSE_APP_URL
        sync: false
      - key: VITE_CRM_APP_URL
        sync: false
      - key: VITE_PULSE_APP_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: RESEND_FROM_NAME
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ENFORCE_HTTPS
        value: "true"
    disk:
      name: pulse-app-disk
      mountPath: /var/pulse-storage
      sizeGB: 1

  # Cron jobs cannot use Render persistent disks. This invokes POST /api/internal/privacy-maintenance
  # on a web instance that mounts STORAGE_PATH. For a split CRM (disk) + Pulse (no disk) deploy, set
  # PRIVACY_MAINTENANCE_URL to the CRM API only, e.g. https://your-crm.onrender.com/api/internal/privacy-maintenance
  - type: cron
    name: pulse-retention-sweep
    runtime: node
    plan: starter
    rootDir: .
    schedule: "0 20 * * *"
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && node scripts/triggerPrivacyMaintenanceHttp.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRIVACY_MAINTENANCE_URL
        sync: false
      - key: PRIVACY_MAINTENANCE_SECRET
        sync: false

databases:
  - name: pulse-db
    plan: basic
    databaseName: pulse
    user: pulse
