# Render Blueprint — adjust names and regions as needed.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pulse-web
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: INVITE_TOKEN_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: STORAGE_PATH
        value: /var/pulse-storage
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ENFORCE_HTTPS
        value: "true"
    disk:
      name: pulse-disk
      mountPath: /var/pulse-storage
      sizeGB: 1

databases:
  - name: pulse-db
    plan: basic
    databaseName: pulse
    user: pulse
