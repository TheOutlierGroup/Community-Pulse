name: Nightly Quality

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  e2e-full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full Playwright suite
        run: npm run test:e2e

  k6-performance:
    if: ${{ secrets.K6_BASE_URL != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      K6_BASE_URL: ${{ secrets.K6_BASE_URL }}
      K6_AUTH_BEARER: ${{ secrets.K6_AUTH_BEARER }}
      K6_SURVEY_SUBMIT_PATH: ${{ secrets.K6_SURVEY_SUBMIT_PATH }}
      K6_DASHBOARD_PATH: ${{ secrets.K6_DASHBOARD_PATH }}
      K6_SLUG_PATH: ${{ secrets.K6_SLUG_PATH }}
      K6_FRESHNESS_KEY: ${{ secrets.K6_FRESHNESS_KEY }}
      K6_MAX_WAIT_SECONDS: ${{ secrets.K6_MAX_WAIT_SECONDS }}
      K6_TARGET_WINDOW_SECONDS: ${{ secrets.K6_TARGET_WINDOW_SECONDS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run survey submission profile
        run: npm run perf:k6:survey

      - name: Run dashboard burst profile
        run: npm run perf:k6:dashboard

      - name: Run dashboard freshness profile
        run: npm run perf:k6:freshness

      - name: Run slug resolution profile
        run: npm run perf:k6:slug

      - name: Run soak profile
        run: npm run perf:k6:soak
