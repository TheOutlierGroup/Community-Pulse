name: Nightly Quality

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  e2e-full:
    # ubuntu-latest moved to Ubuntu 26.04 on ~1 Nov 2026, and Playwright
    # 1.59 refuses to install browsers there ("does not support chromium on
    # ubuntu26.04-x64"), which failed this job on every run since. Pinned to
    # 24.04 until Playwright is upgraded to a release that supports 26.04;
    # then switch back to ubuntu-latest.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run full Playwright suite
        run: npm run test:e2e

  k6-performance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      K6_BASE_URL: ${{ secrets.K6_BASE_URL }}
      K6_AUTH_BEARER: ${{ secrets.K6_AUTH_BEARER }}
      K6_SURVEY_SUBMIT_PATH: ${{ secrets.K6_SURVEY_SUBMIT_PATH }}
      K6_DASHBOARD_PATH: ${{ secrets.K6_DASHBOARD_PATH }}
      K6_SLUG_PATH: ${{ secrets.K6_SLUG_PATH }}
      K6_FRESHNESS_KEY: ${{ secrets.K6_FRESHNESS_KEY }}
      K6_MAX_WAIT_SECONDS: ${{ secrets.K6_MAX_WAIT_SECONDS }}
      K6_TARGET_WINDOW_SECONDS: ${{ secrets.K6_TARGET_WINDOW_SECONDS }}
    steps:
      - name: Checkout
        if: ${{ env.K6_BASE_URL != '' }}
        uses: actions/checkout@v4

      - name: Setup k6
        if: ${{ env.K6_BASE_URL != '' }}
        uses: grafana/setup-k6-action@v1

      - name: Run survey submission profile
        if: ${{ env.K6_BASE_URL != '' }}
        run: npm run perf:k6:survey

      - name: Run dashboard burst profile
        if: ${{ env.K6_BASE_URL != '' }}
        run: npm run perf:k6:dashboard

      - name: Run dashboard freshness profile
        if: ${{ env.K6_BASE_URL != '' }}
        run: npm run perf:k6:freshness

      - name: Run slug resolution profile
        if: ${{ env.K6_BASE_URL != '' }}
        run: npm run perf:k6:slug

      - name: Run soak profile
        if: ${{ env.K6_BASE_URL != '' }}
        run: npm run perf:k6:soak
