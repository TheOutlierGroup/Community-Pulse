name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      # PT-07: the audit count had drifted to 8 (2 high) with nothing
      # watching it. Fails the build on high or critical only — moderates
      # are reported but don't block, so a transitive advisory published
      # overnight can't wedge an unrelated PR.
      - name: Audit backend dependencies
        run: npm audit --audit-level=high

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      # BRAND-02: the Rhythm Engine build must never bundle Outlier's CRM
      # admin pages (see AppRhythmEngine.jsx). Builds both surfaces and
      # inspects the actual output, the same way the original defect was
      # found — a source-text check can't see this class of regression.
      - name: Verify Rhythm Engine build excludes CRM pages
        run: npm run verify:surface-bundles

      # PT-07: critical rather than high, unlike the backend, for one
      # known reason: xlsx carries a high advisory with no fix on the npm
      # registry (SheetJS ships patched builds from their own CDN only),
      # and it is genuinely in use — dynamically imported in
      # ClientTaskDetailPanel to preview spreadsheet attachments. Raise
      # this to high once that is migrated or replaced; don't delete the
      # step.
      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical

  e2e-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke (Chromium)
        run: npm run test:e2e -- --project=chromium --workers=1
